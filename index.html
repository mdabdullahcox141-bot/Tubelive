<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TubeLive World</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f0f0f;color:white;padding-bottom:70px}
.top{position:sticky;top:0;background:#0f0f0f;display:flex;justify-content:space-between;align-items:center;padding:12px 15px;z-index:10;border-bottom:1px solid #222}
.logo{font-weight:900;font-size:20px}.logo span{color:red}
.setting{font-size:22px}
.cat-bar{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#0f0f0f}
.cat{padding:6px 12px;background:#272727;border-radius:8px;white-space:nowrap;font-size:14px}.cat.active{background:white;color:black}
#grid{padding:10px;display:grid;gap:12px}
.card{background:#0f0f0f;border-radius:12px;overflow:hidden}
.thumb{height:200px;background:#222;position:relative;border-radius:12px;display:flex;align-items:center;justify-content:center;color:yellow;font-weight:900;font-size:22px}
.time{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,0.8);padding:2px 6px;border-radius:4px;font-size:12px;color:white}
.info{padding:10px;display:flex;gap:10px}
.bottom{position:fixed;bottom:0;left:0;width:100%;background:#0f0f0f;display:flex;justify-content:space-around;align-items:center;padding:8px 0;border-top:1px solid #222;z-index:20}
.b-item{text-align:center;font-size:11px;color:#aaa;flex:1}
.b-item.active{color:white}
.b-plus{width:40px;height:30px;background:white;color:black;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;margin:auto}
</style>
</head>
<body>

<!-- উপরে শুধু TubeLive + Setting -->
<div class="top">
<div class="logo">▶️ TubeLive</div>
<div class="setting" onclick="alert('Setting Coming!')">⚙️</div>
</div>

<div class="cat-bar">
<div class="cat active">All</div><div class="cat">Drama</div><div class="cat">Gaming</div><div class="cat">News</div><div class="cat">Music</div>
</div>

<div id="grid">
<div class="card"><div class="thumb">ডেলিভারি ম্যানের আসল পরিচয়<div class="time">15:56</div></div><div class="info">🎭 Drama • 18k views</div></div>
<div class="card"><div class="thumb">দুনিয়া টাকার গোলাম<div class="time">38:03</div></div><div class="info">🎭 Drama • 1.9M views</div></div>
</div>

<!-- নিচে তোমার চাওয়া Bar -->
<div class="bottom">
<div class="b-item active">🏠<br>Home</div>
<div class="b-item">⚡<br>Short</div>
<div class="b-item"><div class="b-plus">+</div></div>
<div class="b-item">📺<br>Subscribers</div>
<div class="b-item">👤<br>You</div>
</div>

<input type="file" id="file" style="display:none">
<script>
document.querySelector('.b-plus').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=(e)=>{alert("✅ Video Upload: "+e.target.files[0].name+" (17MB) - YouTube Style!");}
</script>
</body>
</html>
